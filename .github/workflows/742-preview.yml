name: Deploy 742 review preview to GitHub Pages

on:
  push:
    branches: [codex/742-preview-checkpoint]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy-preview:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact preview checkpoint
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Validate cross-platform preview surface
        run: |
          npm run check:600s
          npm run check:es1930m
          node --check viewer/742-runtime.js
          node scripts/validate_742_runtime_contract.mjs
          python3 -B scripts/validate_742_glb.py
          python3 -B scripts/validate_742_portable_posed_glb.py
          python3 -B scripts/validate_742_route.py

      - name: Assemble non-release review preview
        run: |
          python3 -B scripts/assemble_pages.py
          python3 -B scripts/write_pages_attestation.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages preview
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy Pages preview
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Verify public preview routes
        run: |
          curl --fail --location --retry 8 --retry-delay 5 "${{ steps.deployment.outputs.page_url }}742/" --output /dev/null
          curl --fail --location --retry 8 --retry-delay 5 "${{ steps.deployment.outputs.page_url }}assets/models/742.glb" --output /dev/null
