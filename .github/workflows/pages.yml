name: Deploy combined equipment explorer to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact presentation candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Validate public presentation contracts
        run: |
          test "${GITHUB_SHA}" = "$(git rev-parse HEAD)"
          git diff --exit-code
          git diff --cached --exit-code
          node --check viewer.js
          python3 -B scripts/validate_viewer_contract.py
          python3 -B scripts/validate_600s_configuration.py
          python3 -B scripts/validate_600s_glb.py --skip-receipt
          node --check viewer/runtime.js
          node --check machines/es1930m/articulation.js
          node scripts/validate_es1930m_gestures.mjs
          node scripts/validate_es1930m_figure_eight.mjs
          python3 -B scripts/validate_es1930m_runtime_contract.py
          python3 -B scripts/validate_es1930m_kinematics.py
          python3 -B scripts/validate_es1930m_glb.py
          node --check viewer/742-runtime.js
          node scripts/validate_742_figure_eight.mjs
          node scripts/validate_742_runtime_contract.mjs
          python3 -B scripts/validate_742_glb.py
          python3 -B scripts/validate_742_actual_glb_clearance_sweep.py
          python3 -B scripts/validate_742_portable_posed_glb.py
          python3 -B scripts/validate_742_route.py

      - name: Assemble allowlisted public site
        run: |
          python3 -B scripts/assemble_pages.py
          python3 -B scripts/write_pages_attestation.py
          python3 -B scripts/validate_showcase_pages_bundle.py _site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy combined showcase
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Verify exact deployed showcase
        run: |
          python3 -B scripts/verify_showcase_pages.py \
            --base-url "${{ steps.deployment.outputs.page_url }}" \
            --build-manifest _site/pages-build-manifest.json \
            --workflow-run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --output _attestations/showcase-pages-http-attestation.json

      - name: Upload public presentation attestation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: combined-showcase-pages-attestation
          path: _attestations
          if-no-files-found: error
