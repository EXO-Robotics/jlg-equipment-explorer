name: Deploy static viewer to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate model and runtime contracts
        run: npm run check

      - name: Assemble static site
        run: |
          mkdir -p _site/assets/models _site/vendor
          cp index.html viewer.css viewer.js _site/
          cp assets/models/600s.glb assets/models/600s.version.js assets/models/600s.configuration.json _site/assets/models/
          cp -R vendor/three-r160 _site/vendor/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
